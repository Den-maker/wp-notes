<div class="name-row">
    [text* user-fullname id:user-fullname placeholder "Name"]
</div>

<div class="form-row">
    <div class="field-container email-icon-wrapper">
        <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
        </span>
        [email* user-email id:user-email placeholder "Email"]
    </div>
    
    <div class="button-container">
        [submit class:btn "Send Message"]
    </div>
</div>

<style>
/* 1. Reset & Layout */
.form-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
}

.field-container {
    flex: 1 1 0; /* Растягивается, уступая место кнопке */
    min-width: 0; /* Позволяет сжиматься меньше содержимого (важно для Flex) */
}

.button-container {
    flex: 0 0 auto; /* Кнопка не сжимается и не растет */
}

/* 2. Inputs Styling */
#user-fullname, 
#user-email {
    padding: 10px 20px;
    width: 100%;
    border: 1px solid #ccc;
    box-sizing: border-box;
    border-radius: 10px;
    display: block;
    transition: all 0.3s ease;
}

#user-fullname {
    margin-bottom: 20px; /* Отступ между Name и нижним рядом */
}

/* 3. Interactive States (Focus) */
#user-fullname:focus,
#user-email:focus {
    outline: none;
    border-color: #2ea44f;
    box-shadow: 0 0 5px rgba(46, 164, 79, 0.3);
}

/* 4. Icon Positioning */
.email-icon-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none; /* Клик проходит сквозь иконку в инпут */
    z-index: 5;
    line-height: 0;
}

.input-icon svg {
    fill: #999;
    transition: fill 0.3s;
}

#user-email {
    padding-left: 45px !important; /* Место под иконку */
}

/* Магия :has() - красим иконку, если инпут внутри обертки в фокусе */
.email-icon-wrapper:has(#user-email:focus) .input-icon svg {
    fill: #2ea44f;
}

/* 5. Button Styling */
input.btn {
    padding: 10px 25px;
    color: white;
    background-color: #2ea44f;
    border: 1px solid rgba(27, 31, 35, .15);
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s;
}

input.btn:hover {
    background-color: #2c974b;
}

/* 6. CF7 Specifics (Spinner & Messages) */
.wpcf7-spinner {
    position: absolute;
    right: 0; 
    bottom: -25px;
}

.wpcf7-response-output {
    margin: 10px 0 0 0 !important;
    padding: 10px !important;
    font-size: 14px;
    border-radius: 10px;
    border: 2px solid #ccc !important;
}

.wpcf7.sent .wpcf7-response-output {
    border-color: #2ea44f !important;
}

/* 7. Mobile Adaptivity */
@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
        gap: 15px;
    }
    .field-container, .button-container, input.btn {
        width: 100%;
        flex: 0 0 100%;
    }
}
</style>
